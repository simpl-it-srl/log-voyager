name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Create distribution archive
        run: |
          cd dist
          zip -r ../log-voyager-dist.zip .
          tar -czf ../log-voyager-dist.tar.gz .
          cd ..

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Log Voyager ${{ steps.get_version.outputs.version }}
          body: |
            ## 🚀 Log Voyager ${{ steps.get_version.outputs.version }}

            ### Download Options

            - **ZIP Archive**: `log-voyager-dist.zip`
            - **TAR.GZ Archive**: `log-voyager-dist.tar.gz`

            ### Deployment

            1. Download and extract the archive
            2. Serve the contents using any static web server
            3. Or use Docker: `docker build -t log-voyager .`

            ### What's Included

            - Production-optimized build
            - PWA support for offline usage
            - All assets and dependencies bundled

            For installation instructions, see [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)
          files: |
            log-voyager-dist.zip
            log-voyager-dist.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
